<!doctype html><html lang=de><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>AGA Westerwald Run</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#080d09;color:#eee;font:14px monospace}button{font:inherit;padding:14px;border:2px solid #405136;background:#151d15;color:#eee;box-shadow:5px 5px #000}.s{display:none;position:absolute;inset:0;padding:14px;box-sizing:border-box}.on{display:block}.w{max-width:720px;margin:auto}.p{border:3px solid #405136;background:#101610;padding:16px;box-shadow:7px 7px #000}.hero h1{font-size:clamp(42px,11vw,80px);line-height:.8}.hero span{color:#a8c58b}.scene{height:160px;background:#1a2940;position:relative;overflow:hidden;border:2px solid #405136}.hill{position:absolute;bottom:30px;width:80%;height:80px;background:#304735;clip-path:polygon(0 100%,25% 35%,45% 65%,65% 10%,100% 100%)}.road{position:absolute;bottom:0;left:40%;width:20%;height:55px;background:#343a32;clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}.a{display:grid;gap:10px;margin-top:12px}.pri{background:#8da774;color:#081008}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.stat{border:2px solid #405136;padding:9px;text-align:center}.stat b{display:block;color:#d9c77c;font-size:20px}.lab{display:grid;grid-template-columns:1fr 160px;gap:10px}.av{background:#1b2619;border:2px solid #405136}.av canvas{width:100%;image-rendering:pixelated}.pre{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.colors{display:grid;grid-template-columns:1fr 1fr;gap:6px}.colors label{font-size:9px;border:1px solid #34412e;padding:6px}.colors input{width:100%}.nav{display:flex;gap:8px;margin-top:10px}.nav button{flex:1}.game{padding:0}.game canvas{width:100%;height:100%;display:block}.hud{position:absolute;z-index:2;top:8px;left:10px;right:10px;display:flex;justify-content:space-between}.hud b{color:#d9c77c}.touch{position:absolute;z-index:3;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.touch button{pointer-events:auto;width:60px;height:60px;padding:0}.over{position:absolute;z-index:5;inset:0;background:#050805df;display:none;align-items:center;justify-content:center;padding:14px}.over .p{text-align:center;width:90%}.lb div{display:grid;grid-template-columns:35px 1fr 60px;padding:8px;border-bottom:1px solid #283224}.score{text-align:right;color:#d9c77c}@media(max-width:600px){.lab{grid-template-columns:1fr 120px}}</style><section id=home class="s on"><div class=w><div class=p><small>AGA // RENNEROD</small><h1>AGA<br><span>WESTERWALD</span></h1><p>LAUFEN · SPRINGEN · DURCHHALTEN</p><div class=scene><div class=hill></div><div class=road></div></div></div><div class=a><button class=pri onclick="show('lab')">▶ STARTEN</button><button onclick="show('lab')">✦ CHARAKTER</button><button onclick="show('scores');scores()">🏆 RANGLISTE</button></div><div class=stats><div class=stat><b id=bh>0</b>BEST</div><div class=stat><b id=dh>0</b>STRECKE</div><div class=stat><b>∞</b>AGA</div></div></div></section><section id=lab class=s><div class=w><div class=p><h2>CHARACTER LAB</h2><input id=name placeholder=Nickname maxlength=20 style="width:100%;box-sizing:border-box;background:#0b120b;color:#fff;border:2px solid #405136;padding:10px"><div class=pre><button onclick=pre('r')>REKRUT</button><button onclick=pre('j')>JÄGER 🚬</button><button onclick=pre('m')>SANITÄTER 🍺</button></div><div class=lab><div class=colors><label>UNIFORM<input id=u type=color></label><label>HELM<input id=h type=color></label><label>STIEFEL<input id=b type=color></label><label>HAUT<input id=sk type=color></label></div><div class=av><canvas id=av width=160 height=180></canvas></div></div><p>Jäger: Kippe am Mund · Sanitäter: Bierkrug — nur Deko</p><div class=nav><button onclick="show('home')">⌂ HOME</button><button class=pri onclick=start>▶ LOS!</button></div></div></div></section><section id=scores class=s><div class=w><div class=p><h2>🏆 RANGLISTE</h2><div id=list></div><div class=nav><button onclick="show('home')">⌂ HOME</button><button class=pri onclick="show('lab')">▶ SPIELEN</button></div></div></div></section><section id=game class="s game"><div class=hud>PTS <b id=pts>0</b><span>M <b id=met>0</b></span><span>BEST <b id=best>0</b></span></div><canvas id=c width=900 height=600></canvas><div class=touch><div><button id=L>◀</button><button id=R>▶</button></div><button id=J>▲</button></div><div id=over class=over><div class=p><h2>RUN BEENDET</h2><p>Punkte: <b id=fp>0</b><br>Strecke: <b id=fm>0</b> m<br>Best: <b id=fb>0</b></p><div class=nav><button class=pri onclick=start>NOCH EINMAL</button><button onclick=goHome>⌂ HOME</button></div></div></div></section><script>const $=x=>document.getElementById(x),P={r:['#5f6a48','#30372a','#1d2118','#b88f72',''],j:['#465437','#243020','#151812','#9f755c','c'],m:['#6d7452','#596448','#22241b','#c09678','b']};let q=P.r,n=localStorage.n||'Rekrut',s=JSON.parse(localStorage.s||'[]');name.value=n;function show(x){document.querySelectorAll('.s').forEach(e=>e.classList.remove('on'));$(x).classList.add('on');if(x=='home'){bh.textContent=localStorage.best||0;dh.textContent=localStorage.dist||0}}function goHome(){run=false;show('home')}function pre(x){q=P[x];u.value=q[0];h.value=q[1];b.value=q[2];sk.value=q[3];avd()}function avd(){let x=av.getContext('2d');x.fillStyle='#1b2619';x.fillRect(0,0,160,180);x.fillStyle=q[2];x.fillRect(58,120,15,40);x.fillRect(88,120,15,40);x.fillStyle=q[0];x.fillRect(48,70,65,52);x.fillStyle=q[3];x.fillRect(37,82,12,28);x.fillRect(113,82,12,28);x.fillRect(68,42,34,34);x.fillStyle=q[1];x.fillRect(63,36,44,9);x.fillRect(72,29,28,8);if(q[4]=='c'){x.fillStyle='#f2eee4';x.fillRect(100,62,26,3);x.fillStyle='#e35f4a';x.fillRect(124,61,4,4)}if(q[4]=='b'){x.fillStyle='#d4ae58';x.fillRect(110,90,20,28);x.fillStyle='#fff2c9';x.fillRect(108,86,24,7);x.strokeStyle='#d4ae58';x.lineWidth=4;x.beginPath();x.arc(131,104,8,-1.57,1.57);x.stroke()}}['u','h','b','sk'].forEach((z,i)=>$(z).oninput=()=>{q[i]=$(z).value;avd()});pre('r');let run=0,last=0,dist=0,score=0,vy=0,ground=1,px=150,os=[],sp=.8,kl=0,kr=0,j=0;L.onpointerdown=()=>kl=1;L.onpointerup=()=>kl=0;R.onpointerdown=()=>kr=1;R.onpointerup=()=>kr=0;J.onpointerdown=()=>j=1;onkeydown=e=>{if(e.key=='ArrowLeft'||e.key=='a')kl=1;if(e.key=='ArrowRight'||e.key=='d')kr=1;if(e.key==' '||e.key=='ArrowUp'||e.key=='w'||e.key=='z')j=1};onkeyup=e=>{if(e.key=='ArrowLeft'||e.key=='a')kl=0;if(e.key=='ArrowRight'||e.key=='d')kr=0};function save(){n=(name.value||'Rekrut').trim().slice(0,20)||'Rekrut';localStorage.n=n}function start(){save();show('game');run=1;dist=score=0;vy=0;ground=1;px=150;os=[];sp=.8;over.style.display='none';last=performance.now();requestAnimationFrame(loop)}function upd(t){dist+=17*t;px+=(kr-kl)*210*t;px=Math.max(50,Math.min(400,px));if(j&&ground){vy=-760;ground=0}j=0;vy+=1850*t;let y=510+vy*t;if(y>=510){y=510;vy=0;ground=1}sp-=t;if(sp<0){os.push({x:920,y:485,w:70,h:25});sp=.9+Math.random()*.7}os.forEach(o=>o.x-=340*t);if(os.some(o=>px+18>o.x&&px-18<o.x+o.w&&y+35>o.y)){end();return}os=os.filter(o=>o.x>-100);score=Math.floor(dist);pts.textContent=score;met.textContent=Math.floor(dist);best.textContent=localStorage.best||0}function end(){run=0;let z=Math.max(+localStorage.best||0,score);localStorage.best=z;localStorage.dist=Math.floor(dist);s.push({n,s:score});s.sort((a,b)=>b.s-a.s);s=s.slice(0,20);localStorage.s=JSON.stringify(s);fp.textContent=score;fm.textContent=Math.floor(dist);fb.textContent=z;over.style.display='flex'}function bg(){ctx.fillStyle='#18243a';ctx.fillRect(0,0,900,600);ctx.fillStyle='#2f4869';ctx.fillRect(0,180,900,220);ctx.fillStyle='#314832';for(let i=0;i<12;i++){let x=(i*100-dist*15)%1000;x=x<0?x+1000:x;ctx.fillRect(x,430,75,90);ctx.fillRect(x+15,410,45,20)}ctx.fillStyle='#373a31';ctx.fillRect(0,540,900,60)}function guy(){let x=px,y=510;ctx.fillStyle=q[2];ctx.fillRect(x-12,y+30,10,28);ctx.fillRect(x+3,y+30,10,28);ctx.fillStyle=q[0];ctx.fillRect(x-16,y,32,32);ctx.fillStyle=q[3];ctx.fillRect(x-28,y+18,8,7);ctx.fillRect(x+20,y+18,8,7);ctx.fillRect(x-9,y-24,18,20);ctx.fillStyle=q[1];ctx.fillRect(x-12,y-29,24,7);ctx.fillRect(x-8,y-35,16,6);if(q[4]=='c'){ctx.fillStyle='#f2eee4';ctx.fillRect(x+8,y-8,13,2);ctx.fillStyle='#e35f4a';ctx.fillRect(x+19,y-9,3,3)}if(q[4]=='b'){ctx.fillStyle='#d4ae58';ctx.fillRect(x+17,y+17,10,14);ctx.fillStyle='#fff2c9';ctx.fillRect(x+16,y+14,12,4);ctx.strokeStyle='#d4ae58';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x+28,y+24,5,-1.57,1.57);ctx.stroke()}}function draw(){bg();os.forEach(o=>{ctx.fillStyle='#6b4529';ctx.fillRect(o.x,o.y,o.w,o.h)});guy()}function loop(t){if(!run)return;let dt=Math.min(.03,(t-last)/1000);last=t;upd(dt);draw();requestAnimationFrame(loop)}function scores(){list.innerHTML=s.length?s.map((x,i)=>`<div><b>${i+1}</b><span>${x.n}</span><span class=score>${x.s} P</span></div>`).join(''):'<div>NOCH KEINE SCORES</div>'}const ctx=c.getContext('2d');draw();avd()</script>
